name: CPU checks
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install --upgrade pip 'setuptools<82' wheel
      - run: python -m pip install torch==2.1.0+cpu --extra-index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install . --no-deps
      - run: python -m pip check
      - name: Run unit tests with the installed package
        working-directory: ${{ runner.temp }}
        run: python -m unittest discover -s "$GITHUB_WORKSPACE/tests" -v
      - name: Load installed configurations outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          for dataset in sciplex3 op3; do
            for stage in train train-mask evaluate; do
              scdvd "$stage" --config-name "$dataset" --cfg job --resolve
            done
          done
      - name: Exercise the installed package on both dataset mappings
        working-directory: ${{ runner.temp }}
        run: |
          python "$GITHUB_WORKSPACE/scripts/cpu_demo.py" --output "$RUNNER_TEMP/scdvd-demo"
          python "$GITHUB_WORKSPACE/scripts/cpu_demo.py" --config-name op3 --evaluation-split ood --output "$RUNNER_TEMP/scdvd-op3-demo"
