name: CPU checks
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install torch==2.1.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install . --no-deps
      - run: python -m unittest discover -s tests -v
      - name: Load installed configurations outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          scdvd train --config-name sciplex3 --cfg job
          scdvd train-mask --config-name op3 --cfg job
          scdvd evaluate --config-name op3 --cfg job
      - run: python examples/cpu_demo.py --output /tmp/scdvd-demo
