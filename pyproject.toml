[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scdvd"
version = "0.2.1"
description = "Single-cell Dual-view Diffusion for Perturbation Prediction"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Seunghoo Song"}, {name = "Minsik Oh"}]
dependencies = [
  "setuptools>=64,<82",
  "torch>=2.1", "lightning>=2.2", "numpy>=1.26,<2", "scipy>=1.13",
  "h5py>=3.11", "hydra-core>=1.3,<1.4", "omegaconf>=2.3,<2.4",
  "geomloss==0.2.6",
]

[project.optional-dependencies]
data = ["anndata>=0.10", "pandas>=2.2"]
dev = ["pytest>=7"]

[project.scripts]
scdvd = "scdvd.cli:main"

[project.urls]
Repository = "https://github.com/mjuailab/scDVD"
Issues = "https://github.com/mjuailab/scDVD/issues"

[tool.setuptools]
include-package-data = false
packages = [
  "scdvd", "scdvd.data", "scdvd.diffusion", "scdvd.models", "scdvd.configs",
  "scdvd.configs.dataset", "scdvd.configs.model", "scdvd.configs.training",
]

[tool.setuptools.package-dir]
"" = "src"
"scdvd.configs" = "configs"

[tool.setuptools.package-data]
"scdvd.configs" = ["*.yaml"]
"scdvd.configs.dataset" = ["*.yaml"]
"scdvd.configs.model" = ["*.yaml"]
"scdvd.configs.training" = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
